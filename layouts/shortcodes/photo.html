{{- $src := .Get "src" -}}
{{- $image := partial "media/image.html" (dict "page" .Page "src" $src) -}}
{{- $width := .Get "width" | default "80" -}}
{{- $size := "wide" -}}
{{- if eq $width "60" -}}{{- $size = "narrow" -}}{{- else if eq $width "75" -}}{{- $size = "medium" -}}{{- end -}}
<figure class="photo photo--{{ $size }}">
  {{ partial "responsive-image.html" (dict "resource" $image "alt" (.Get "alt") "zoom" true) }}
  {{ with .Get "caption" }}<figcaption>{{ . }}</figcaption>{{ end }}
</figure>
