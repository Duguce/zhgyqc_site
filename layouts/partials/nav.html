{{ $language := partial "site/language.html" . }}
<nav class="nav" aria-label="{{ if $language.isChinese }}主导航{{ else }}Main navigation{{ end }}">
      <a href="{{ .Site.Home.RelPermalink }}" class="nav-logo">
        <img src="{{ print "" .Site.Params.logo.url | relURL }}"
         width="{{ .Site.Params.logo.width }}"
         height="{{ .Site.Params.logo.height }}"
         alt="{{ .Site.Title }}">
      </a>

         <ul class="nav-links" lang="en">
            {{ $current := .Type }}
            {{ if .IsHome }}{{ $current = "home" }}{{ end }}
            {{ range .Site.Menus.main }}
                <li><a href="{{ .URL | relURL }}"{{ if eq .Identifier $current }} class="is-current" aria-current="{{ if $.IsPage }}location{{ else }}page{{ end }}"{{ end }}>{{ .Name }}</a></li>
            {{ end }}
         </ul>
</nav>
