<!DOCTYPE html>
<html lang="{{ if eq .Section "cn" }}zh-CN{{ else }}{{ .Site.LanguageCode }}{{ end }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ .Site.Title }}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<!--     <script src="https://d3js.org/d3.v6.min.js"></script> -->
    {{ $styleVersion := readFile "themes/hugo-ht/static/css/style.css" | md5 }}
    <link rel="stylesheet" href="{{ "/css/style.css" | relURL }}?v={{ $styleVersion }}" />
    <link rel="stylesheet" href="{{ "/css/fonts.css" | relURL }}" />
    {{ partial "head_custom.html" . }}
  </head>
  
  <body{{ if or .IsHome (eq .RelPermalink "/") (eq .RelPermalink "./") }} class="home-page"{{ end }}>
    <div class="wrapper">
      <header class="header">
        {{ partial "nav.html" . }}
      </header>
